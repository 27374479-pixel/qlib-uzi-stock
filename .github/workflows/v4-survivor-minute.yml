name: V4 survivor minute validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-survivor-minute.yml"
      - "traderharness_hf_probe.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-survivor-minute
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Inspect TraderHarness 5-minute yearly partitions
        run: python traderharness_hf_probe.py

      - name: Persist dataset partition probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -f output/traderharness_hf_probe.json || git add -f output/traderharness_hf_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "research: persist TraderHarness partition probe [skip ci]"
            git push
          fi
