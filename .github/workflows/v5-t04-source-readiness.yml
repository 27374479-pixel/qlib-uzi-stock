name: V5 T04 source readiness
on:
  pull_request:
    branches: ["codex/v5-t03-trend-entry-source-readiness"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile v5_t04_low_buy_position_source_readiness.py
      - run: python v5_t04_low_buy_position_source_readiness.py
