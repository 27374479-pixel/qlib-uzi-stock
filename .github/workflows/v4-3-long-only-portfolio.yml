name: V4.3 long-only executable portfolio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-3-long-only-portfolio.yml"
      - "v4_3_long_only_portfolio.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-3-long-only-portfolio
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<3" pandas pyarrow duckdb baostock requests

      - name: Materialize frozen CSI800 membership
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt
          test -s qlib_data/cn_data/instruments/csi800.txt

      - name: Verify persisted 2021-2026 minute slices
        shell: bash
        run: |
          for y in 2021 2022 2023 2024 2025 2026; do
            f="data_lake/raw/traderharness/paired_ext_5min_${y}.parquet"
            test -s "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Run V4.3 long-only portfolio backtest
        run: python v4_3_long_only_portfolio.py

      - name: Persist V4.3 results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            output/v4_3_long_only_portfolio.json \
            output/v4_3_primary_trade_ledger.csv; do
            test ! -f "$f" || git add -f "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "research: persist V4.3 long-only backtest [skip ci]"
            git push
          fi
