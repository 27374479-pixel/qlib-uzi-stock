name: V4.17 point-in-time event lake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-17-event-lake.yml"
      - "v4_17_event_lake.py"
      - "v4_17_validate_event_lake.py"
      - "V4_17_POINT_IN_TIME_EVENT_LAKE.md"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: false
        default: "2026-07-16"
      end:
        description: "End date YYYY-MM-DD"
        required: false
        default: "2026-07-16"

permissions:
  contents: write

concurrency:
  group: v4-17-event-lake
  cancel-in-progress: false

jobs:
  collect-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.start || '2026-07-16' }}
      END_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.end || '2026-07-16' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow akshare requests

      - name: Collect archived announcements
        run: |
          python v4_17_event_lake.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --strict

      - name: Validate point-in-time contract
        run: |
          python v4_17_validate_event_lake.py \
            --start "$START_DATE" \
            --end "$END_DATE"

      - name: Persist V4.17 smoke data and validation
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data_lake/raw/eastmoney/notices || true
          git add -f data_lake/manifests/v4_17_eastmoney_notice_requests_*.csv || true
          git add -f output/v4_17_event_lake_validation.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data: persist V4.17 point-in-time notice archive [skip ci]"
            git push
          fi
