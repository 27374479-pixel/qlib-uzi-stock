name: V5 R02 opportunity classifier source readiness

on:
  push:
    branches:
      - "codex/v5-r02-opportunity-source-readiness"
    paths:
      - "V5_R02_OPPORTUNITY_CLASSIFIER_SOURCE_REVIEW.md"
      - "v5_r02_opportunity_classifier_source_readiness.py"
      - "test_v5_r02_opportunity_classifier_source_readiness.py"
      - ".github/workflows/v5-r02-opportunity-source-readiness.yml"
  pull_request:
    paths:
      - "V5_R02_OPPORTUNITY_CLASSIFIER_SOURCE_REVIEW.md"
      - "v5_r02_opportunity_classifier_source_readiness.py"
      - "test_v5_r02_opportunity_classifier_source_readiness.py"
      - ".github/workflows/v5-r02-opportunity-source-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile R02 gate
        run: python -m py_compile v5_r02_opportunity_classifier_source_readiness.py
      - name: Run R02 unit tests
        run: pytest -q test_v5_r02_opportunity_classifier_source_readiness.py
      - name: Emit frozen R02 source-readiness report
        run: python v5_r02_opportunity_classifier_source_readiness.py
      - name: Verify current R02 remains fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/v5_r02_opportunity_classifier_source_readiness/report.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          d = r['decision']
          assert d['status'] == 'DEFER_NUMERIC_CLASSIFIER_PREREGISTRATION'
          assert d['ready'] is False
          assert d['classifier_preregistration_authorized'] is False
          assert d['classifier_return_screen_authorized'] is False
          assert d['effective_opportunity_state'] == 'UNKNOWN'
          assert d['action'] == 'CASH_ONLY'
          assert d['paper_trading_authorized'] is False
          assert d['live_trading_authorized'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - name: Upload R02 source-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-r02-opportunity-source-readiness
          path: output/v5_r02_opportunity_classifier_source_readiness/
          if-no-files-found: error
          retention-days: 14
