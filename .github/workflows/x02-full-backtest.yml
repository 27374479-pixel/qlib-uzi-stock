name: X02 full execution backtest

on:
  pull_request:
    paths:
      - ".github/workflows/x02-full-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Fetch only required LFS datasets
        run: |
          git lfs install --local
          git lfs pull --include="data_lake/raw/baostock/equity_daily/*.parquet,data_lake/raw/baostock/industry_snapshots/*.parquet,data_lake/raw/traderharness/*.parquet" --exclude=""
          python - <<'PY'
          from pathlib import Path
          paths = sorted(Path('data_lake/raw/traderharness').glob('paired_ext_5min_*.parquet'))
          print('minute files:', [(p.name, p.stat().st_size) for p in paths])
          assert len(paths) == 6
          assert all(p.stat().st_size > 1000000 for p in paths), 'LFS minute data were not materialized'
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow duckdb

      - name: Run frozen X02 execution validation
        run: |
          python run_x02_execution_validation.py

      - name: Print primary results
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('output/x02_reproduction_20260912')
          for name in ['execution_gate.json','paper_trial_readiness.json','execution_uncertainty.json','execution_stability.json','next_bar_execution_comparison.json','execution_validation_run_manifest.json']:
              p = out / name
              print(f'\n===== {name} =====')
              if p.exists():
                  print(p.read_text(encoding='utf-8')[:30000])
              else:
                  print('MISSING')
          PY

      - name: Upload X02 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x02-full-backtest-results
          path: output/x02_reproduction_20260912/
          if-no-files-found: warn
          retention-days: 14
