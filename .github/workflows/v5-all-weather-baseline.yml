name: V5 all-weather baseline

on:
  pull_request:
    paths:
      - "V5_ALL_WEATHER_PREREGISTRATION.md"
      - "v5_all_weather_regime.py"
      - "test_v5_all_weather_regime.py"
      - ".github/workflows/v5-all-weather-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow duckdb pytest

      - name: Compile V5 baseline
        run: python -m py_compile v5_all_weather_regime.py

      - name: Run V5 unit tests
        run: pytest -q test_v5_all_weather_regime.py

  backtest:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Fetch required point-in-time datasets
        run: |
          git lfs install --local
          git lfs pull --include="data_lake/raw/baostock/equity_daily/*.parquet,data_lake/raw/baostock/industry_snapshots/*.parquet,data_lake/raw/traderharness/*.parquet" --exclude=""
          python - <<'PY'
          from pathlib import Path
          paths = sorted(Path('data_lake/raw/traderharness').glob('paired_ext_5min_*.parquet'))
          print('minute files:', [(p.name, p.stat().st_size) for p in paths])
          assert len(paths) == 6
          assert all(p.stat().st_size > 1_000_000 for p in paths), 'LFS minute data were not materialized'
          PY

      - name: Materialize canonical CSI800 membership path
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt
          test -s qlib_data/cn_data/instruments/csi800.txt
          echo "CSI800 membership rows: $(wc -l < qlib_data/cn_data/instruments/csi800.txt)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow duckdb

      - name: Rebuild frozen X02 execution series
        run: python run_x02_execution_validation.py

      - name: Run preregistered V5 X02-cash regime baseline
        run: python v5_all_weather_regime.py

      - name: Print V5 report
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('output/v5_all_weather_baseline/report.json')
          print(p.read_text(encoding='utf-8') if p.exists() else 'V5 REPORT MISSING')
          PY

      - name: Upload V5 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-all-weather-baseline-results
          path: |
            output/v5_all_weather_baseline/
            output/x02_reproduction_20260912/execution_gate.json
            output/x02_reproduction_20260912/paper_trial_readiness.json
          if-no-files-found: warn
          retention-days: 14
