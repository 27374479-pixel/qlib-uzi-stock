name: CSI800 5m data and validation

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of missing CSI800 stocks to backfill this run"
        required: false
        default: "30"
  push:
    branches: [main]
    paths:
      - ".github/workflows/csi800-minute-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/csi800-minute-validation.yml"
      - "pipeline-kick/**"

permissions:
  contents: write

concurrency:
  group: csi800-minute-data
  cancel-in-progress: false

env:
  UNIVERSE_ASOF: "20250102"
  DATA_START: "20241001"
  DATA_END: "20260903"
  BACKTEST_START: "20250102"
  BACKTEST_END: "20260903"

jobs:
  backfill-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout without downloading old LFS data
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<3" pandas pyarrow baostock requests

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs track "data_lake/raw/baostock/equity_5min/*.parquet"

      - name: Backfill next missing CSI800 batch
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '30' }}
        run: |
          python github_csi800_minute_pipeline.py \
            --asof "$UNIVERSE_ASOF" \
            --start "$DATA_START" \
            --end "$DATA_END" \
            --batch-size "$BATCH_SIZE" \
            --retries 3 \
            --page-size 10000

      - name: Read coverage
        id: coverage
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d = json.loads(Path('output/github_csi800_minute_status.json').read_text(encoding='utf-8'))
          print(f"ratio={d['coverage_ratio']:.8f}")
          print(f"completed={d['completed_count']}")
          print(f"expected={d['expected_count']}")
          PY

      - name: Smoke-test the real bars downloaded in this run
        run: |
          python five_experts_intraday_backtest.py \
            --start 20260105 \
            --end "$BACKTEST_END" \
            --universe cached \
            --top-n 5 \
            --output output/github_csi800_batch_smoke.json || true

      - name: Pull cumulative LFS data at 90 percent coverage
        if: ${{ fromJSON(steps.coverage.outputs.ratio) >= 0.90 }}
        run: git lfs pull --include="data_lake/raw/baostock/equity_5min/*.parquet"

      - name: Run cumulative frozen-CSI800 validation
        if: ${{ fromJSON(steps.coverage.outputs.ratio) >= 0.90 }}
        run: |
          python five_experts_intraday_backtest.py \
            --start "$BACKTEST_START" \
            --end "$BACKTEST_END" \
            --universe cached \
            --top-n 5 \
            --output output/github_csi800_full_validation.json

      - name: Commit reusable data, state and results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes
          git add -f data_lake/universe data_lake/state data_lake/manifests output/github_csi800_minute_status.json
          git add -f data_lake/raw/baostock/equity_5min/*.parquet
          test ! -f output/github_csi800_batch_smoke.json || git add -f output/github_csi800_batch_smoke.json
          test ! -f output/github_csi800_full_validation.json || git add -f output/github_csi800_full_validation.json
          if git diff --cached --quiet; then
            echo "No new data to commit"
            exit 0
          fi
          git commit -m "data: extend frozen CSI800 5m backtest lake [skip ci]"
          git push
