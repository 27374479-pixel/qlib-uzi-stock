name: V3 repair and screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v3-repair-and-screen.yml"

permissions:
  contents: write

env:
  DATA_START: "2014-01-01"
  SIGNAL_START: "2015-01-01"
  DATA_END: "2026-09-03"
  OOS_START: "2023-01-01"

jobs:
  repair-and-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<3" pandas pyarrow baostock pytest

      - name: Restore the persisted v3 data lake exactly once
        run: |
          git lfs install
          git lfs pull --include="data_lake/raw/baostock/equity_daily/*.parquet,data_lake/raw/baostock/industry_snapshots/*.parquet,data_lake/universe/*_snapshots.parquet" --exclude=""
          echo "daily=$(find data_lake/raw/baostock/equity_daily -name '*.parquet' | wc -l)"
          echo "industry=$(find data_lake/raw/baostock/industry_snapshots -name '*.parquet' | wc -l)"

      - name: Validate every daily parquet and repair only corrupt symbols
        run: |
          python validate_and_repair_daily_cache.py \
            --start "$DATA_START" --end "$DATA_END" \
            --retries 8 --retry-delay 2

      - name: Validate coverage and industry parquet readability
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          expected = [x.strip() for x in Path('data_lake/universe/csi800_membership_instruments.txt').read_text().splitlines() if x.strip()]
          daily = sorted(Path('data_lake/raw/baostock/equity_daily').glob('*.parquet'))
          industry = sorted(Path('data_lake/raw/baostock/industry_snapshots').glob('*.parquet'))
          snapshots = pd.read_parquet('data_lake/universe/csi800_membership_monthly_snapshots.parquet')
          expected_industry = pd.to_datetime(snapshots['snapshot_date']).dt.normalize().nunique()
          print(f'daily coverage={len(daily)}/{len(expected)}')
          print(f'industry coverage={len(industry)}/{expected_industry}')
          if len(daily) != len(expected):
              raise SystemExit('daily coverage is not exactly complete')
          if len(industry) != expected_industry:
              raise SystemExit('industry coverage is not exactly complete')
          for number, path in enumerate(industry, 1):
              pd.read_parquet(path)
              if number == 1 or number % 25 == 0:
                  print(f'validated industry {number}/{len(industry)}')
          print('industry parquet integrity: PASS')
          PY

      - name: Persist any repaired market data before alpha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes
          git add -f data_lake/raw/baostock/equity_daily/*.parquet
          git add -f data_lake/manifests/baostock_*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data: repair corrupt v3 parquet cache [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No corrupt daily parquet required repair"
          fi

      - name: Prepare point-in-time Qlib membership
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt

      - name: Run canonical v3 book hypothesis screen
        run: |
          python book_alpha_daily_screen_v3.py \
            --start "$SIGNAL_START" --end "$DATA_END" --oos-start "$OOS_START" \
            --round-trip-cost 0.0018 --bootstrap-samples 5000 \
            --output output/book_alpha_daily_screen_v3.json \
            --observations-output output/book_alpha_daily_screen_observations_v3.parquet

      - name: Decompose where apparent alpha actually occurs
        run: |
          python attention_timing_decomposition.py \
            --start "$SIGNAL_START" --end "$DATA_END" --oos-start "$OOS_START" \
            --round-trip-cost 0.0018 --bootstrap-samples 5000 \
            --output output/attention_timing_decomposition_v1.json

      - name: Run external A-share challenger screen
        run: |
          python external_challenger_daily_screen.py \
            --start "$SIGNAL_START" --end "$DATA_END" --oos-start "$OOS_START" \
            --round-trip-cost 0.0018 --bootstrap-samples 5000 \
            --output output/external_challenger_daily_screen_v1.json

      - name: Build evidence registry
        run: |
          python build_alpha_evidence_registry.py
          cat output/alpha_evidence_registry_v1.md

      - name: Persist alpha evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes
          git add -f output/book_alpha_daily_screen_v3.json output/book_alpha_daily_screen_observations_v3.parquet
          git add -f output/attention_timing_decomposition_v1.json output/external_challenger_daily_screen_v1.json
          git add -f output/alpha_evidence_registry_v1.json output/alpha_evidence_registry_v1.md
          if ! git diff --cached --quiet; then
            git commit -m "research: persist repaired v3 alpha evidence [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-repair-screen-output
          path: |
            output/book_alpha_daily_screen_v3.json
            output/book_alpha_daily_screen_observations_v3.parquet
            output/attention_timing_decomposition_v1.json
            output/external_challenger_daily_screen_v1.json
            output/alpha_evidence_registry_v1.json
            output/alpha_evidence_registry_v1.md
            data_lake/manifests/baostock_*.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
