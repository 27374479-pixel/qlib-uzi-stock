name: V5 M02 market-cycle source readiness

on:
  push:
    branches:
      - "codex/v5-m02-market-cycle-source-readiness"
    paths:
      - "V5_M02_MARKET_CYCLE_SOURCE_REVIEW.md"
      - "V5_M01_MARKET_TAPE_REPRESENTATION_SPEC.md"
      - "V5_M01_RESULT.md"
      - "v5_m02_market_cycle_source_readiness.py"
      - "test_v5_m02_market_cycle_source_readiness.py"
      - ".github/workflows/v5-m02-market-cycle-source-readiness.yml"
  pull_request:
    branches:
      - "codex/v5-m01-market-tape-representation"
    paths:
      - "V5_M02_MARKET_CYCLE_SOURCE_REVIEW.md"
      - "V5_M01_MARKET_TAPE_REPRESENTATION_SPEC.md"
      - "V5_M01_RESULT.md"
      - "v5_m02_market_cycle_source_readiness.py"
      - "test_v5_m02_market_cycle_source_readiness.py"
      - ".github/workflows/v5-m02-market-cycle-source-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile M02 gate
        run: python -m py_compile v5_m02_market_cycle_source_readiness.py
      - name: Run M02 unit tests
        run: pytest -q test_v5_m02_market_cycle_source_readiness.py
      - name: Emit frozen M02 source-readiness report
        run: python v5_m02_market_cycle_source_readiness.py
      - name: Verify current M02 remains fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/v5_m02_market_cycle_source_readiness/report.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          d = r['decision']
          assert d['status'] == 'DEFER_MARKET_CYCLE_CLASSIFIER_PREREGISTRATION'
          assert d['ready'] is False
          assert d['classifier_preregistration_authorized'] is False
          assert d['return_screen_authorized'] is False
          assert d['w01_return_screen_authorized'] is False
          assert d['effective_action'] == 'SOURCE_AND_INDEPENDENT_TARGET_RESEARCH_ONLY'
          assert d['paper_trading_authorized'] is False
          assert d['live_trading_authorized'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - name: Upload M02 source-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-m02-market-cycle-source-readiness
          path: output/v5_m02_market_cycle_source_readiness/
          if-no-files-found: error
          retention-days: 14
