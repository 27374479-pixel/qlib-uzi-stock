name: X02 next-bar execution audit tests

on:
  pull_request:
    paths:
      - "audit_x02_next_bar_execution.py"
      - "audit_x02_minute_bar_structure.py"
      - "compare_x02_next_bar_execution.py"
      - "evaluate_x02_execution_gate.py"
      - "run_x02_execution_validation.py"
      - "x02_provenance.py"
      - "reproduce_x02_local.py"
      - "test_x02_next_bar_execution.py"
      - "test_x02_minute_bar_structure.py"
      - "test_compare_x02_next_bar_execution.py"
      - "test_evaluate_x02_execution_gate.py"
      - "test_run_x02_execution_validation.py"
      - "test_x02_provenance.py"
      - ".github/workflows/x02-next-bar-execution-audit.yml"
  push:
    branches: [main]
    paths:
      - "audit_x02_next_bar_execution.py"
      - "audit_x02_minute_bar_structure.py"
      - "compare_x02_next_bar_execution.py"
      - "evaluate_x02_execution_gate.py"
      - "run_x02_execution_validation.py"
      - "x02_provenance.py"
      - "reproduce_x02_local.py"
      - "test_x02_next_bar_execution.py"
      - "test_x02_minute_bar_structure.py"
      - "test_compare_x02_next_bar_execution.py"
      - "test_evaluate_x02_execution_gate.py"
      - "test_run_x02_execution_validation.py"
      - "test_x02_provenance.py"
      - ".github/workflows/x02-next-bar-execution-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest

      - name: Compile execution audit modules
        run: |
          python -m py_compile x02_provenance.py
          python -m py_compile reproduce_x02_local.py
          python -m py_compile audit_x02_next_bar_execution.py
          python -m py_compile audit_x02_minute_bar_structure.py
          python -m py_compile compare_x02_next_bar_execution.py
          python -m py_compile evaluate_x02_execution_gate.py
          python -m py_compile run_x02_execution_validation.py

      - name: Run next-bar execution regression tests
        run: |
          pytest -q \
            test_x02_next_bar_execution.py \
            test_x02_minute_bar_structure.py \
            test_compare_x02_next_bar_execution.py \
            test_evaluate_x02_execution_gate.py \
            test_run_x02_execution_validation.py \
            test_x02_provenance.py
