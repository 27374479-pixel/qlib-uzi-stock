name: V5 L02 preregistered stage economic screen

on:
  push:
    branches:
      - "codex/v5-l02-stage-economic-prereg"
    paths:
      - "V5_L02_STAGE_ECONOMIC_PREREGISTRATION.md"
      - "V5_L01_LEADER_STAGE_PROXY_SPEC.md"
      - "v5_l01_leader_stage_transition_audit.py"
      - "v5_l02_stage_economic_screen.py"
      - "test_v5_l02_stage_economic_screen.py"
      - ".github/workflows/v5-l02-stage-economic.yml"
  pull_request:
    paths:
      - "V5_L02_STAGE_ECONOMIC_PREREGISTRATION.md"
      - "V5_L01_LEADER_STAGE_PROXY_SPEC.md"
      - "v5_l01_leader_stage_transition_audit.py"
      - "v5_l02_stage_economic_screen.py"
      - "test_v5_l02_stage_economic_screen.py"
      - ".github/workflows/v5-l02-stage-economic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow duckdb pytest
      - name: Compile L02 screen
        run: python -m py_compile v5_l02_stage_economic_screen.py
      - name: Run L02 unit tests
        run: pytest -q test_v5_l02_stage_economic_screen.py

  screen:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Fetch persisted point-in-time daily datasets
        run: |
          git lfs install --local
          git lfs pull --include="data_lake/raw/baostock/equity_daily/*.parquet,data_lake/raw/baostock/industry_snapshots/*.parquet" --exclude=""
          python - <<'PY'
          from pathlib import Path
          daily = sorted(Path('data_lake/raw/baostock/equity_daily').glob('*.parquet'))
          industry = sorted(Path('data_lake/raw/baostock/industry_snapshots').glob('*.parquet'))
          print('daily parquet count', len(daily), 'industry parquet count', len(industry))
          assert daily and industry
          assert all(p.stat().st_size > 500 for p in daily[:10])
          PY
      - name: Materialize canonical CSI800 membership path
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt
          test -s qlib_data/cn_data/instruments/csi800.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install screen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow duckdb
      - name: Run frozen L02 screen
        run: python v5_l02_stage_economic_screen.py
      - name: Print L02 primary summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/v5_l02_stage_economic/report.json')
          if not p.exists():
              print('L02 REPORT MISSING')
          else:
              r = json.loads(p.read_text(encoding='utf-8'))
              print(json.dumps({
                  'counts': r.get('counts'),
                  'primary_qualification': r.get('primary_qualification'),
                  'development_2d': r.get('periods', {}).get('development_2021_2023', {}).get('2d'),
                  'historical_later_2d': r.get('periods', {}).get('historical_later_2024_plus', {}).get('2d'),
              }, ensure_ascii=False, indent=2))
          PY
      - name: Upload L02 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-l02-stage-economic-results
          path: output/v5_l02_stage_economic/
          if-no-files-found: warn
          retention-days: 14
