name: V5 W08 leader evidence

on:
  pull_request:
    branches: ["codex/v5-m07-recovery-state-readiness"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas pyarrow pytest
      - run: python -m py_compile v5_w08_leader_evidence.py
      - run: pytest -q test_v5_w08_leader_evidence.py

  audit:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Fetch persisted point-in-time datasets
        run: |
          git lfs install --local
          git lfs pull --include="data_lake/raw/baostock/equity_daily/*.parquet,data_lake/raw/baostock/industry_snapshots/*.parquet" --exclude=""
      - name: Materialize CSI800 membership
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas pyarrow
      - name: Run frozen W08 structural audit
        run: python v5_w08_leader_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-w08-leader-evidence-results
          path: output/v5_w08_leader_evidence/
          if-no-files-found: warn
          retention-days: 14
