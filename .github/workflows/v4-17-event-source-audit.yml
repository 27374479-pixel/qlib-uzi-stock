name: V4.17 Event Source Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v4_17_event_source_audit.py"
      - ".github/workflows/v4-17-event-source-audit.yml"

permissions:
  contents: write

concurrency:
  group: v4-17-event-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code without large LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas pyarrow

      - name: Pull event-lake LFS only
        run: |
          git lfs install
          git lfs pull --include="data_lake/raw/cninfo/notices/**,data_lake/raw/eastmoney/notices/**" --exclude=""

      - name: Run cross-source audit
        run: python v4_17_event_source_audit.py

      - name: Validate known smoke overlap
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          s = json.load(open('output/v4_17_event_source_audit.json', encoding='utf-8'))
          d = pd.read_csv('output/v4_17_event_source_audit_stock_days.csv', dtype={'security_code': str})
          row = d[(d['security_code'].str.zfill(6) == '000006') & (d['published_date'] == '2024-06-13')]
          assert len(row) == 1, row
          r = row.iloc[0]
          assert int(r['cninfo_rows']) == 2
          assert int(r['eastmoney_rows']) == 2
          assert int(r['exact_title_matches']) == 2, row.to_dict('records')
          assert float(r['cninfo_match_rate']) == 1.0
          assert float(r['eastmoney_match_rate']) == 1.0
          assert s['canonicalizer_used_for_trading_features'] is False
          print(row.to_string(index=False))
          print(s)
          PY

      - name: Persist audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/v4_17_event_source_audit.json output/v4_17_event_source_audit_stock_days.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: persist V4.17 event source audit [skip ci]"
          git push origin HEAD:main
