name: V4.17 CNINFO Full Event Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-17-cninfo-full-backfill.yml"

permissions:
  contents: write

concurrency:
  group: v4-17-cninfo-full-backfill
  cancel-in-progress: false

env:
  START_DATE: "20210101"
  END_DATE: "20260716"
  SHARD_COUNT: "8"

jobs:
  backfill:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout code only
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "akshare>=1.17.82" pandas pyarrow

      - name: Backfill shard
        run: |
          python v4_17_cninfo_event_backfill.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --universe-file data_lake/universe/csi800_membership_monthly.tsv \
            --output-root "tmp/v4_17_cninfo/notices" \
            --manifest-dir "tmp/v4_17_cninfo/manifests" \
            --shard-count "$SHARD_COUNT" \
            --shard-index "${{ matrix.shard }}" \
            --max-retries 6 \
            --sleep-seconds 0.15 \
            --strict

      - name: Shard sanity check
        run: |
          python - <<'PY'
          import glob, json, os
          import pandas as pd

          manifests = glob.glob('tmp/v4_17_cninfo/manifests/*.json')
          files = glob.glob('tmp/v4_17_cninfo/notices/*.parquet')
          assert len(manifests) == 1, manifests
          m = json.load(open(manifests[0], encoding='utf-8'))
          assert not m['failed_symbols'], m['failed_symbols']
          assert len(files) == m['successful_symbols'] == m['requested_symbols']
          for path in files:
              df = pd.read_parquet(path)
              if len(df):
                  assert not df['event_id'].duplicated().any(), path
                  assert set(df['schema_version'].unique()) == {'v2'}
                  assert (pd.to_datetime(df['eligible_from_date']) > pd.to_datetime(df['published_date'])).all()
          print('shard', m['shard_index'], 'symbols', len(files), 'rows', m['fresh_rows'])
          PY

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: cninfo-shard-${{ matrix.shard }}
          path: tmp/v4_17_cninfo
          retention-days: 2
          if-no-files-found: error

  consolidate:
    needs: backfill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code only
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: cninfo-shard-*
          path: tmp/v4_17_cninfo_merged
          merge-multiple: true

      - name: Consolidate and validate complete universe
        run: |
          python - <<'PY'
          import glob
          import json
          from pathlib import Path
          import pandas as pd
          from v4_17_cninfo_event_backfill import load_universe_symbols, parse_date

          start = parse_date('20210101')
          end = parse_date('20260716')
          expected = set(load_universe_symbols(Path('data_lake/universe/csi800_membership_monthly.tsv'), start, end))
          notice_paths = sorted(glob.glob('tmp/v4_17_cninfo_merged/notices/*.parquet'))
          manifest_paths = sorted(glob.glob('tmp/v4_17_cninfo_merged/manifests/*.json'))
          actual = {Path(p).stem for p in notice_paths}

          assert len(manifest_paths) == 8, f'manifests={len(manifest_paths)}'
          assert actual == expected, f'missing={sorted(expected-actual)[:20]} extra={sorted(actual-expected)[:20]}'

          shard_manifests = [json.load(open(p, encoding='utf-8')) for p in manifest_paths]
          assert all(not m['failed_symbols'] for m in shard_manifests)
          assert sum(m['requested_symbols'] for m in shard_manifests) == len(expected)

          frames = []
          zero_row_symbols = []
          for path in notice_paths:
              df = pd.read_parquet(path)
              if df.empty:
                  zero_row_symbols.append(Path(path).stem)
                  continue
              assert not df['event_id'].duplicated().any(), path
              assert set(df['schema_version'].unique()) == {'v2'}, path
              published = pd.to_datetime(df['published_date'])
              eligible = pd.to_datetime(df['eligible_from_date'])
              assert (eligible > published).all(), path
              assert published.dt.date.min() >= start and published.dt.date.max() <= end, path
              frames.append(df)

          all_rows = pd.concat(frames, ignore_index=True) if frames else pd.DataFrame()
          assert not all_rows.empty
          assert not all_rows['event_id'].duplicated().any(), 'global duplicate event_id'

          rows_by_year = (
              pd.to_datetime(all_rows['published_date']).dt.year.value_counts().sort_index().astype(int).to_dict()
          )
          summary = {
              'schema_version': 'v2',
              'provider': 'cninfo',
              'requested_start': start.isoformat(),
              'requested_end': end.isoformat(),
              'expected_symbols': len(expected),
              'parquet_files': len(notice_paths),
              'zero_row_symbols': zero_row_symbols,
              'total_rows': int(len(all_rows)),
              'unique_event_ids': int(all_rows['event_id'].nunique()),
              'unique_source_event_ids_nonempty': int(all_rows.loc[all_rows['source_event_id'].ne(''), 'source_event_id'].nunique()),
              'min_published_date': str(all_rows['published_date'].min()),
              'max_published_date': str(all_rows['published_date'].max()),
              'rows_by_year': {str(k): int(v) for k, v in rows_by_year.items()},
              'shard_rows': {str(m['shard_index']): int(m['fresh_rows']) for m in shard_manifests},
              'point_in_time_policy': {
                  'event_time_precision': 'date',
                  'eligible_from': 'published_date + 1 calendar day',
                  'intraday_time_inference': False,
              },
          }
          out = Path('tmp/v4_17_cninfo_merged/manifests/cninfo_notices_20210101_20260716_summary.json')
          out.write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Replace canonical CNINFO event lake
        run: |
          rm -rf data_lake/raw/cninfo/notices
          mkdir -p data_lake/raw/cninfo/notices data_lake/manifests
          cp -f tmp/v4_17_cninfo_merged/notices/*.parquet data_lake/raw/cninfo/notices/
          cp -f tmp/v4_17_cninfo_merged/manifests/*.json data_lake/manifests/

      - name: Persist canonical event lake
        run: |
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data_lake/raw/cninfo/notices data_lake/manifests/cninfo_notices_20210101_20260716_*.json
          if git diff --cached --quiet; then
            echo "No CNINFO backfill changes"
            exit 0
          fi
          git commit -m "data: persist V4.17 CNINFO 2021-2026 event lake [skip ci]"
          git push origin HEAD:main
