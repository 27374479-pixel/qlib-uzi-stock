name: V4.1 paired minute execution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-paired-execution.yml"
      - "v4_paired_execution.py"
      - "traderharness_paired_import.py"
      - "v4_paired_evidence_gate.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-paired-execution
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<3" pandas pyarrow duckdb huggingface_hub baostock requests

      - name: Materialize frozen CSI800 membership
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt
          test -s qlib_data/cn_data/instruments/csi800.txt
          echo "membership rows: $(wc -l < qlib_data/cn_data/instruments/csi800.txt)"

      - name: Build complete selected and control code set
        run: |
          python - <<'PY'
          import v4_intraday_survivor_validation as base
          import v4_survivor_wrapper as survivor
          import v4_paired_execution as paired
          cfg = base.Config(start='2015-01-01', end='2026-09-03')
          frame = survivor.prepare(cfg)
          paired.write_paired_codes(frame, '2025-01-02')
          PY

      - name: Sequentially import paired TraderHarness 2025-2026 history
        env:
          HF_HUB_DISABLE_XET: "1"
        shell: bash
        run: |
          timeout 10800 python traderharness_paired_import.py \
            --sleep 20 \
            --retries 3 \
            --end 2026-09-03

      - name: Run V4.1 paired execution matrix
        run: |
          python v4_paired_execution.py \
            --start 2015-01-01 \
            --end 2026-09-03 \
            --sample-start 2025-01-02 \
            --entry-times 14:30,14:45,14:55 \
            --exit-times 09:30,10:00,15:00 \
            --min-side-sizes 5,10 \
            --bootstrap-samples 5000 \
            --output output/v4_paired_execution.json

      - name: Apply sample-size and stability evidence gate
        run: python v4_paired_evidence_gate.py

      - name: Persist paired minute slice and V4.1 results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install
          git lfs track "data_lake/raw/traderharness/*.parquet"
          git add .gitattributes
          test ! -f data_lake/raw/traderharness/paired_5min_2025.parquet || git add -f data_lake/raw/traderharness/paired_5min_2025.parquet
          test ! -f data_lake/raw/traderharness/paired_5min_2026.parquet || git add -f data_lake/raw/traderharness/paired_5min_2026.parquet
          test ! -f output/traderharness_paired_5min_manifest.json || git add -f output/traderharness_paired_5min_manifest.json
          test ! -f output/v4_paired_codes.txt || git add -f output/v4_paired_codes.txt
          test ! -f output/v4_paired_execution.json || git add -f output/v4_paired_execution.json
          test ! -f output/v4_paired_evidence_gate.json || git add -f output/v4_paired_evidence_gate.json
          if ! git diff --cached --quiet; then
            git commit -m "research: persist v4.1 paired execution results [skip ci]"
            git push
          fi
