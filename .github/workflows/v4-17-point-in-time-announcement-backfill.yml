name: V4.17 point-in-time announcement backfill

on:
  pull_request:
    paths:
      - ".github/workflows/v4-17-point-in-time-announcement-backfill.yml"
      - "v4_17_point_in_time_announcement_backfill.py"
      - "v4_17_validate_event_lake.py"
      - "v4_17_full_backfill_gate.py"
      - "V4_17_POINT_IN_TIME_EVENT_LAKE.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-17-point-in-time-announcement-backfill.yml"
      - "v4_17_point_in_time_announcement_backfill.py"
      - "v4_17_validate_event_lake.py"
      - "v4_17_full_backfill_gate.py"
      - "V4_17_POINT_IN_TIME_EVENT_LAKE.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-17-point-in-time-announcement-backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow akshare

      - name: Smoke-test source contract and causal validation
        shell: bash
        run: |
          rm -rf /tmp/v417-smoke
          python v4_17_point_in_time_announcement_backfill.py \
            --start 2024-01-02 \
            --end 2024-01-12 \
            --output-root /tmp/v417-smoke/data_lake/raw/eastmoney/notices \
            --manifest-root /tmp/v417-smoke/data_lake/manifests \
            --sleep 0.20
          python v4_17_validate_event_lake.py \
            --start 2024-01-02 \
            --end 2024-01-12 \
            --event-root /tmp/v417-smoke/data_lake/raw/eastmoney/notices \
            --manifest-root /tmp/v417-smoke/data_lake/manifests \
            --output /tmp/v417-smoke/output/v4_17_event_lake_validation.json
          python v4_17_full_backfill_gate.py \
            --start 2024-01-02 \
            --end 2024-01-12 \
            --event-root /tmp/v417-smoke/data_lake/raw/eastmoney/notices \
            --manifest-root /tmp/v417-smoke/data_lake/manifests \
            --validation /tmp/v417-smoke/output/v4_17_event_lake_validation.json \
            --output /tmp/v417-smoke/output/v4_17_full_backfill_gate.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-17-smoke
          path: /tmp/v417-smoke
          if-no-files-found: warn

  backfill:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow akshare

      - name: Backfill one calendar year
        shell: bash
        run: |
          year="${{ matrix.year }}"
          start="${year}-01-01"
          if [ "$year" = "2026" ]; then
            end="2026-07-16"
          else
            end="${year}-12-31"
          fi
          root="/tmp/v417-${year}"
          rm -rf "$root"
          python v4_17_point_in_time_announcement_backfill.py \
            --start "$start" \
            --end "$end" \
            --output-root "$root/data_lake/raw/eastmoney/notices" \
            --manifest-root "$root/data_lake/manifests" \
            --sleep 0.25

      - name: Upload yearly partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-17-notices-${{ matrix.year }}
          path: /tmp/v417-${{ matrix.year }}
          if-no-files-found: warn

  validate-and-persist:
    if: github.event_name != 'pull_request'
    needs: backfill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Download yearly partitions
        uses: actions/download-artifact@v4
        with:
          pattern: v4-17-notices-*
          path: /tmp/v417-merged
          merge-multiple: true

      - name: Materialize merged event lake
        shell: bash
        run: |
          mkdir -p data_lake/raw/eastmoney/notices data_lake/manifests
          cp -R /tmp/v417-merged/data_lake/raw/eastmoney/notices/. data_lake/raw/eastmoney/notices/
          cp /tmp/v417-merged/data_lake/manifests/v4_17_eastmoney_notice_requests_*.csv data_lake/manifests/

      - name: Validate full point-in-time archive
        run: |
          python v4_17_validate_event_lake.py \
            --start 2021-01-01 \
            --end 2026-07-16 \
            --output output/v4_17_event_lake_validation.json

      - name: Enforce full-backfill completion gate
        run: |
          python v4_17_full_backfill_gate.py \
            --start 2021-01-01 \
            --end 2026-07-16 \
            --validation output/v4_17_event_lake_validation.json \
            --output output/v4_17_full_backfill_gate.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-17-validation
          path: |
            output/v4_17_event_lake_validation.json
            output/v4_17_full_backfill_gate.json
            data_lake/manifests/v4_17_eastmoney_notice_requests_*.csv
          if-no-files-found: warn

      - name: Persist validated V4.17 event lake
        shell: bash
        run: |
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_lake/raw/eastmoney/notices
          git add data_lake/manifests/v4_17_eastmoney_notice_requests_*.csv
          git add -f output/v4_17_event_lake_validation.json
          git add -f output/v4_17_full_backfill_gate.json
          if ! git diff --cached --quiet; then
            git commit -m "data: persist V4.17 point-in-time announcements [skip ci]"
            git pull --rebase origin main
            git push
          fi
