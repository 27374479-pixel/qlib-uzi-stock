name: V5 W03 absolute-leader source readiness

on:
  push:
    branches:
      - "codex/v5-w03-absolute-leader-source-readiness"
    paths:
      - "V5_W03_ABSOLUTE_LEADER_SOURCE_REVIEW.md"
      - "V5_W02_RESULT.md"
      - "V5_M02_RESULT.md"
      - "V5_BOOK_EVIDENCE_LEDGER.md"
      - "v5_w03_absolute_leader_source_readiness.py"
      - "test_v5_w03_absolute_leader_source_readiness.py"
      - ".github/workflows/v5-w03-absolute-leader-source-readiness.yml"
  pull_request:
    branches:
      - "codex/v5-w02-leader-top-source-readiness"
    paths:
      - "V5_W03_ABSOLUTE_LEADER_SOURCE_REVIEW.md"
      - "V5_W02_RESULT.md"
      - "V5_M02_RESULT.md"
      - "V5_BOOK_EVIDENCE_LEDGER.md"
      - "v5_w03_absolute_leader_source_readiness.py"
      - "test_v5_w03_absolute_leader_source_readiness.py"
      - ".github/workflows/v5-w03-absolute-leader-source-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile W03 gate
        run: python -m py_compile v5_w03_absolute_leader_source_readiness.py
      - name: Run W03 unit tests
        run: pytest -q test_v5_w03_absolute_leader_source_readiness.py
      - name: Emit frozen W03 source-readiness report
        run: python v5_w03_absolute_leader_source_readiness.py
      - name: Verify current W03 remains fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('output/v5_w03_absolute_leader_source_readiness/report.json').read_text(encoding='utf-8'))
          d = r['decision']
          assert d['status'] == 'DEFER_ABSOLUTE_LEADER_PREREGISTRATION'
          assert d['ready'] is False
          assert d['absolute_leader_preregistration_authorized'] is False
          assert d['w01_event_preregistration_authorized'] is False
          assert d['w01_return_screen_authorized'] is False
          assert d['effective_action'] == 'SOURCE_AND_REPRESENTATION_RESEARCH_ONLY'
          assert d['paper_trading_authorized'] is False
          assert d['live_trading_authorized'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - name: Upload W03 source-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-w03-absolute-leader-source-readiness
          path: output/v5_w03_absolute_leader_source_readiness/
          if-no-files-found: error
          retention-days: 14
