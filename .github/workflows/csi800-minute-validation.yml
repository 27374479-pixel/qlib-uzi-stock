name: CSI800 5m data and validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/csi800-minute-validation.yml"

permissions:
  contents: write

concurrency:
  group: csi800-minute-data
  cancel-in-progress: false

env:
  PIPELINE_VERSION: "strict-v3"
  UNIVERSE_ASOF: "20250102"
  DATA_START: "20241001"
  DATA_END: "20260903"
  BACKTEST_START: "20250102"
  BACKTEST_END: "20260903"
  UNIVERSE_FILE: "data_lake/universe/csi800_20250102.txt"
  STATUS_FILE: "data_lake/raw/baostock/daily_status/csi800_20250102_20241001_20260903.parquet"

jobs:
  backfill-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout without downloading old LFS data
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<3" pandas pyarrow baostock requests

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs track "data_lake/raw/baostock/equity_5min/*.parquet"
          git lfs track "data_lake/raw/baostock/daily_status/*.parquet"

      - name: Freeze point-in-time research universe
        run: |
          python - <<'PY'
          import pandas as pd
          from github_csi800_minute_pipeline import freeze_csi800
          codes, meta = freeze_csi800(pd.Timestamp('2025-01-02'))
          print('filtered universe', len(codes), 'raw CSI800', meta['raw_csi800_count'], 'excluded', meta['excluded_count'])
          PY

      - name: Collect historical daily ST and N status
        run: |
          python baostock_daily_universe_status.py \
            --universe-file "$UNIVERSE_FILE" \
            --start "$DATA_START" \
            --end "$DATA_END" \
            --output "$STATUS_FILE"

      - name: Parallel backfill reusable 5-minute history
        shell: bash
        run: |
          CODES="$(paste -sd, "$UNIVERSE_FILE")"
          # Keep a hard wall-clock reserve for reconciliation, validation and
          # Git-LFS upload. Any successfully written symbol survives even if
          # the provider stalls later in the broad run.
          timeout 12600 python baostock_parallel_backfill.py \
            --start "$DATA_START" \
            --end "$DATA_END" \
            --codes "$CODES" \
            --workers 3 \
            --retries 2 \
            --retry-delay 1 || true

      - name: Reconcile exact coverage and fill one edge symbol
        run: |
          python github_csi800_minute_pipeline.py \
            --asof "$UNIVERSE_ASOF" \
            --start "$DATA_START" \
            --end "$DATA_END" \
            --batch-size 1 \
            --retries 2 \
            --page-size 10000

      - name: Read coverage
        id: coverage
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d = json.loads(Path('output/github_csi800_minute_status.json').read_text(encoding='utf-8'))
          print(f"ratio={d['coverage_ratio']:.8f}")
          print(f"completed={d['completed_count']}")
          print(f"expected={d['expected_count']}")
          print(f"excluded={d['excluded_count']}")
          PY

      - name: Commit reusable data checkpoint first
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes
          git add -f data_lake/universe data_lake/state data_lake/manifests output/github_csi800_minute_status.json
          git add -f data_lake/raw/baostock/equity_5min/*.parquet
          git add -f data_lake/raw/baostock/daily_status/*.parquet
          if ! git diff --cached --quiet; then
            git commit -m "data: checkpoint strict frozen-universe 5m lake [skip ci]"
            git push
          fi

      - name: Partial real-data smoke replay
        if: ${{ fromJSON(steps.coverage.outputs.ratio) >= 0.05 && fromJSON(steps.coverage.outputs.ratio) < 0.90 }}
        run: |
          python run_frozen_universe_backtest.py \
            --universe-file "$UNIVERSE_FILE" \
            --status-file "$STATUS_FILE" \
            --start 20260105 \
            --end "$BACKTEST_END" \
            --top-n 5 \
            --output output/github_csi800_partial_smoke.json || true

      - name: Run strict frozen-signal validation
        if: ${{ fromJSON(steps.coverage.outputs.ratio) >= 0.90 }}
        run: |
          python run_frozen_universe_backtest.py \
            --universe-file "$UNIVERSE_FILE" \
            --status-file "$STATUS_FILE" \
            --start "$BACKTEST_START" \
            --end "$BACKTEST_END" \
            --top-n 5 \
            --cost-multiplier 1 \
            --entry-delay-minutes 0 \
            --output output/github_csi800_full_validation.json

      - name: Replay identical signals under cost and delay stress
        if: ${{ fromJSON(steps.coverage.outputs.ratio) >= 0.90 }}
        run: |
          python minute_execution_stress.py \
            --baseline output/github_csi800_full_validation.json \
            --status-file "$STATUS_FILE" \
            --output-dir output/minute_execution_stress

      - name: Build anti-overfit robustness verdict
        if: ${{ fromJSON(steps.coverage.outputs.ratio) >= 0.90 }}
        run: |
          python minute_robustness_report.py \
            --baseline output/minute_execution_stress/baseline_reexec.json \
            --variant cost2x=output/minute_execution_stress/cost2x.json \
            --variant delay5=output/minute_execution_stress/delay5.json \
            --variant delay10=output/minute_execution_stress/delay10.json \
            --variant delay30=output/minute_execution_stress/delay30.json \
            --focus-style yangjia \
            --output output/github_yangjia_minute_robustness.json

      - name: Commit validation results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -f output/github_csi800_partial_smoke.json || git add -f output/github_csi800_partial_smoke.json
          test ! -f output/github_csi800_full_validation.json || git add -f output/github_csi800_full_validation.json
          test ! -f output/github_yangjia_minute_robustness.json || git add -f output/github_yangjia_minute_robustness.json
          test ! -d output/minute_execution_stress || git add -f output/minute_execution_stress
          if ! git diff --cached --quiet; then
            git commit -m "research: persist strict CSI800 robustness validation [skip ci]"
            git push
          fi
