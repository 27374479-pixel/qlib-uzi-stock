name: V5 M06 recovery factor validation

on:
  push:
    branches:
      - "codex/v5-m06-recovery-factor-validation"
    paths:
      - "V5_M06_RECOVERY_FACTOR_PREREG.md"
      - "v5_m06_recovery_factor_validation.py"
      - "test_v5_m06_recovery_factor_validation.py"
      - ".github/workflows/v5-m06-recovery-factor-validation.yml"
  pull_request:
    branches:
      - "codex/v5-m05-recovery-dynamics-representation"
    paths:
      - "V5_M06_RECOVERY_FACTOR_PREREG.md"
      - "v5_m06_recovery_factor_validation.py"
      - "test_v5_m06_recovery_factor_validation.py"
      - ".github/workflows/v5-m06-recovery-factor-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas pyarrow pytest
      - run: python -m py_compile v5_m06_recovery_factor_validation.py
      - run: pytest -q test_v5_m06_recovery_factor_validation.py

  validate:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Fetch persisted point-in-time datasets
        run: |
          git lfs install --local
          git lfs pull --include="data_lake/raw/baostock/equity_daily/*.parquet,data_lake/raw/baostock/industry_snapshots/*.parquet" --exclude=""
      - name: Materialize CSI800 membership
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas pyarrow
      - name: Run frozen M06 non-PnL validation
        run: python v5_m06_recovery_factor_validation.py
      - name: Upload M06 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-m06-recovery-factor-results
          path: output/v5_m06_recovery_factor_validation/
          if-no-files-found: warn
          retention-days: 14
