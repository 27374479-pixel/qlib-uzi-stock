name: V4.17 direct Eastmoney source audit

# NON-PRODUCTION SOURCE AUDIT.
# This collector talks directly to Eastmoney and intentionally has a different
# schema/identity contract. It must never write into the canonical yearly lake.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Inclusive start date YYYY-MM-DD"
        required: false
        default: "2026-07-16"
      end:
        description: "Inclusive end date YYYY-MM-DD"
        required: false
        default: "2026-07-16"

permissions:
  contents: read

concurrency:
  group: v4-17-direct-eastmoney-source-audit
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_DATE: ${{ inputs.start || '2026-07-16' }}
      END_DATE: ${{ inputs.end || '2026-07-16' }}
      ROOT: /tmp/v417-direct-eastmoney
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "akshare==1.18.84" "pandas<3" pyarrow requests

      - name: Collect direct-source sample into isolated audit root
        run: |
          python v4_17_point_in_time_notice_lake.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --root "$ROOT/data_lake/raw/eastmoney_direct/notices" \
            --manifest-root "$ROOT/data_lake/manifests" \
            --retries 4 \
            --retry-sleep 1.0 \
            --request-sleep 0.35

      - name: Validate direct-source audit result
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ["ROOT"])
          manifests = sorted((root / "data_lake/manifests").glob("v4_17_eastmoney_notices_*.json"))
          assert manifests, "missing direct-source audit manifest"
          m = json.loads(manifests[-1].read_text(encoding="utf-8"))
          assert m["days_failed"] == 0, m
          assert m["rows_total"] > 0, "audit window returned zero notices"
          assert m["cross_partition_duplicate_event_ids"] == 0, m
          assert m["point_in_time_policy"]["same_day_usable"] is False
          assert m["point_in_time_policy"]["retrieved_at_is_not_historical_first_seen"] is True

          files = sorted((root / "data_lake/raw/eastmoney_direct/notices").glob("**/*.parquet"))
          assert files, "no direct-source parquet partitions"
          frame = pd.concat([pd.read_parquet(p) for p in files], ignore_index=True)
          assert len(frame) > 0
          assert not frame["same_day_usable"].fillna(True).any()
          assert frame["event_id"].is_unique
          print(json.dumps({k: v for k, v in m.items() if k != "results"}, ensure_ascii=False, indent=2))
          PY

      - name: Upload non-production source-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-17-direct-eastmoney-source-audit
          path: /tmp/v417-direct-eastmoney
          if-no-files-found: warn
