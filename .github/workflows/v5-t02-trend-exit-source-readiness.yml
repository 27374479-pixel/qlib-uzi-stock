name: V5 T02 trend-exit source readiness

on:
  pull_request:
    paths:
      - 'V5_T02_TREND_EXIT_SOURCE_REVIEW.md'
      - 'v5_t02_trend_exit_source_readiness.py'
      - 'test_v5_t02_trend_exit_source_readiness.py'
      - '.github/workflows/v5-t02-trend-exit-source-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile T02 gate
        run: python -m py_compile v5_t02_trend_exit_source_readiness.py
      - name: Run T02 unit tests
        run: pytest -q test_v5_t02_trend_exit_source_readiness.py
      - name: Emit frozen T02 source-readiness report
        run: python v5_t02_trend_exit_source_readiness.py
      - name: Verify current T02 remains fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/v5_t02_trend_exit_source_readiness/report.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          d = r['decision']
          assert d['status'] == 'DEFER_TREND_EXIT_PREREGISTRATION'
          assert d['ready'] is False
          assert d['exit_preregistration_authorized'] is False
          assert d['return_screen_authorized'] is False
          assert d['effective_action'] == 'SOURCE_EXTRACTION_ONLY'
          assert d['paper_trading_authorized'] is False
          assert d['live_trading_authorized'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - name: Upload T02 source-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-t02-trend-exit-source-readiness
          path: output/v5_t02_trend_exit_source_readiness/
          if-no-files-found: error
          retention-days: 14
