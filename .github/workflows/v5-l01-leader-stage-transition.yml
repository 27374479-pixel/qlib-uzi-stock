name: V5 L01 book-grounded leader stage transition

on:
  push:
    branches:
      - "codex/v5-l01-stage-transition-audit"
    paths:
      - "V5_L01_LEADER_STAGE_PROXY_SPEC.md"
      - "v5_l01_leader_stage_transition_audit.py"
      - "test_v5_l01_leader_stage_transition_audit.py"
      - ".github/workflows/v5-l01-leader-stage-transition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow duckdb pytest
      - name: Compile L01 audit
        run: python -m py_compile v5_l01_leader_stage_transition_audit.py
      - name: Run L01 unit tests
        run: pytest -q test_v5_l01_leader_stage_transition_audit.py

  audit:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Fetch persisted point-in-time daily datasets
        run: |
          git lfs install --local
          git lfs pull --include="data_lake/raw/baostock/equity_daily/*.parquet,data_lake/raw/baostock/industry_snapshots/*.parquet" --exclude=""
          python - <<'PY'
          from pathlib import Path
          daily = sorted(Path('data_lake/raw/baostock/equity_daily').glob('*.parquet'))
          industry = sorted(Path('data_lake/raw/baostock/industry_snapshots').glob('*.parquet'))
          print('daily parquet count', len(daily), 'industry parquet count', len(industry))
          assert daily and industry
          PY
      - name: Materialize canonical CSI800 membership path
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt
          test -s qlib_data/cn_data/instruments/csi800.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow duckdb
      - name: Run frozen L01 structural audit
        run: python v5_l01_leader_stage_transition_audit.py
      - name: Print L01 report summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/v5_l01_leader_stage_transition/report.json')
          if not p.exists():
              print('L01 REPORT MISSING')
          else:
              r = json.loads(p.read_text(encoding='utf-8'))
              print(json.dumps({
                  'status': r.get('status'),
                  'period': r.get('period'),
                  'rows': r.get('rows'),
                  'stage_counts': r.get('stage_counts'),
                  'invariant_failures': r.get('invariant_failures'),
                  'precursor_consistency': r.get('precursor_consistency'),
                  'authorizations': r.get('authorizations'),
              }, ensure_ascii=False, indent=2))
          PY
      - name: Upload L01 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-l01-leader-stage-transition-results
          path: output/v5_l01_leader_stage_transition/
          if-no-files-found: warn
          retention-days: 14
