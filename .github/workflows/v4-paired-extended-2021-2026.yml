name: V4.2 extended paired 2021-2026

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-paired-extended-2021-2026.yml"
      - "traderharness_paired_import_2021_2026.py"
      - "v4_paired_execution_2021_2026.py"
      - "v4_paired_evidence_gate_2021_2026.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-paired-extended-2021-2026
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<3" pandas pyarrow duckdb huggingface_hub baostock requests

      - name: Materialize frozen CSI800 membership
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt
          test -s qlib_data/cn_data/instruments/csi800.txt

      - name: Build 2021-2026 complete selected and control code set
        run: python v4_paired_execution_2021_2026.py --prepare-codes

      - name: Sequentially import TraderHarness 2021-2026 paired history
        env:
          HF_HUB_DISABLE_XET: "1"
        shell: bash
        run: |
          timeout 12600 python traderharness_paired_import_2021_2026.py \
            --sleep 20 \
            --retries 3 \
            --end 2026-09-03

      - name: Run extended paired execution matrix
        run: python v4_paired_execution_2021_2026.py

      - name: Apply standard sample-size evidence gate
        run: python v4_paired_evidence_gate_2021_2026.py

      - name: Persist extended minute slices and results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install
          git lfs track "data_lake/raw/traderharness/*.parquet"
          git add .gitattributes
          for y in 2021 2022 2023 2024 2025 2026; do
            f="data_lake/raw/traderharness/paired_ext_5min_${y}.parquet"
            test ! -f "$f" || git add -f "$f"
          done
          for f in \
            output/v4_paired_ext_codes.txt \
            output/traderharness_paired_2021_2026_manifest.json \
            output/v4_paired_execution_2021_2026.json \
            output/v4_paired_evidence_gate_2021_2026.json; do
            test ! -f "$f" || git add -f "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "research: persist extended 2021-2026 paired validation [skip ci]"
            git push
          fi
