name: V5 U03 replacement-leader source readiness

on:
  push:
    branches:
      - "codex/v5-u03-replacement-leader-source-review"
    paths:
      - "V5_U03_REPLACEMENT_LEADER_SOURCE_REVIEW.md"
      - "v5_u03_source_readiness.py"
      - "test_v5_u03_source_readiness.py"
      - ".github/workflows/v5-u03-source-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile U03 gate
        run: python -m py_compile v5_u03_source_readiness.py
      - name: Run U03 unit tests
        run: pytest -q test_v5_u03_source_readiness.py
      - name: Emit frozen U03 source-readiness report
        run: python v5_u03_source_readiness.py
      - name: Verify U03 remains deferred
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/v5_u03_source_readiness/report.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          d = r['decision']
          assert d['status'] == 'DEFER_SIGNAL_PREREGISTRATION'
          assert d['ready'] is False
          assert d['return_screen_authorized'] is False
          assert d['paper_trading_authorized'] is False
          assert d['live_trading_authorized'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - name: Upload U03 source-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-u03-source-readiness
          path: output/v5_u03_source_readiness/
          if-no-files-found: error
          retention-days: 14
