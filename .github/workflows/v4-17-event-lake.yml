name: V4.17 legacy Eastmoney collector audit

# NON-PRODUCTION WORKFLOW.
# The only authoritative writer for the canonical yearly Eastmoney archive is
# v4_17_point_in_time_announcement_backfill.py via
# v4-17-point-in-time-announcement-backfill.yml.
# This legacy implementation is retained only for manual implementation audits
# and MUST write to an isolated temporary root.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: false
        default: "2026-07-16"
      end:
        description: "End date YYYY-MM-DD"
        required: false
        default: "2026-07-16"

permissions:
  contents: read

concurrency:
  group: v4-17-legacy-eastmoney-audit
  cancel-in-progress: true

jobs:
  collect-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      START_DATE: ${{ inputs.start || '2026-07-16' }}
      END_DATE: ${{ inputs.end || '2026-07-16' }}
      ROOT: /tmp/v417-legacy-event-lake
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow akshare requests

      - name: Collect into isolated audit root
        run: |
          python v4_17_event_lake.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --event-root "$ROOT/data_lake/raw/eastmoney/notices" \
            --manifest-root "$ROOT/data_lake/manifests" \
            --strict

      - name: Validate date-level PIT contract only
        run: |
          python v4_17_validate_event_lake.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --event-root "$ROOT/data_lake/raw/eastmoney/notices" \
            --manifest-root "$ROOT/data_lake/manifests" \
            --output "$ROOT/output/v4_17_legacy_event_lake_validation.json"

      - name: Upload non-production audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-17-legacy-eastmoney-audit
          path: /tmp/v417-legacy-event-lake
          if-no-files-found: warn
