name: V5 W02 leader-top source readiness

on:
  push:
    branches:
      - "codex/v5-w02-leader-top-source-readiness"
    paths:
      - "V5_W02_LEADER_TOP_SOURCE_REVIEW.md"
      - "V5_M01_RESULT.md"
      - "V5_M02_MARKET_CYCLE_SOURCE_REVIEW.md"
      - "V5_M02_RESULT.md"
      - "V5_BOOK_EVIDENCE_LEDGER.md"
      - "v5_w02_leader_top_source_readiness.py"
      - "test_v5_w02_leader_top_source_readiness.py"
      - ".github/workflows/v5-w02-leader-top-source-readiness.yml"
  pull_request:
    branches:
      - "codex/v5-m02-market-cycle-source-readiness"
    paths:
      - "V5_W02_LEADER_TOP_SOURCE_REVIEW.md"
      - "V5_M01_RESULT.md"
      - "V5_M02_MARKET_CYCLE_SOURCE_REVIEW.md"
      - "V5_M02_RESULT.md"
      - "V5_BOOK_EVIDENCE_LEDGER.md"
      - "v5_w02_leader_top_source_readiness.py"
      - "test_v5_w02_leader_top_source_readiness.py"
      - ".github/workflows/v5-w02-leader-top-source-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile W02 gate
        run: python -m py_compile v5_w02_leader_top_source_readiness.py
      - name: Run W02 unit tests
        run: pytest -q test_v5_w02_leader_top_source_readiness.py
      - name: Emit frozen W02 source-readiness report
        run: python v5_w02_leader_top_source_readiness.py
      - name: Verify current W02 remains fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/v5_w02_leader_top_source_readiness/report.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          d = r['decision']
          assert d['status'] == 'DEFER_W01_EVENT_PREREGISTRATION'
          assert d['ready'] is False
          assert d['w01_event_preregistration_authorized'] is False
          assert d['w01_return_screen_authorized'] is False
          assert d['effective_action'] == 'SOURCE_AND_REPRESENTATION_RESEARCH_ONLY'
          assert d['x02_change_authorized'] is False
          assert d['portfolio_combination_authorized'] is False
          assert d['paper_trading_authorized'] is False
          assert d['live_trading_authorized'] is False
          e = r['evidence']
          assert e['drawdown_window']['value'] == [3, 7]
          assert e['drawdown_magnitude']['value'] == [0.20, 0.25]
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - name: Upload W02 source-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-w02-leader-top-source-readiness
          path: output/v5_w02_leader_top_source_readiness/
          if-no-files-found: error
          retention-days: 14
