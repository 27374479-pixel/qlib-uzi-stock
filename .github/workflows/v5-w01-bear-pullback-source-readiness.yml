name: V5 W01 bear-pullback source readiness

on:
  pull_request:
    paths:
      - 'V5_W01_BEAR_PULLBACK_SOURCE_REVIEW.md'
      - 'v5_w01_bear_pullback_source_readiness.py'
      - 'test_v5_w01_bear_pullback_source_readiness.py'
      - '.github/workflows/v5-w01-bear-pullback-source-readiness.yml'
      - 'V5_BOOK_EVIDENCE_LEDGER.md'
  workflow_dispatch:

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile W01 gate
        run: python -m py_compile v5_w01_bear_pullback_source_readiness.py
      - name: Run W01 unit tests
        run: pytest -q test_v5_w01_bear_pullback_source_readiness.py
      - name: Emit frozen W01 source-readiness report
        run: python v5_w01_bear_pullback_source_readiness.py
      - name: Verify current W01 remains fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/v5_w01_bear_pullback_source_readiness/report.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          d = r['decision']
          assert d['status'] == 'DEFER_BEAR_PULLBACK_PREREGISTRATION'
          assert d['ready'] is False
          assert d['signal_preregistration_authorized'] is False
          assert d['return_screen_authorized'] is False
          assert d['effective_action'] == 'SOURCE_EXTRACTION_ONLY'
          assert d['paper_trading_authorized'] is False
          assert d['live_trading_authorized'] is False
          params = r['contract']['literal_source_parameters']
          assert params['pullback_window_sessions_min'] == 3
          assert params['pullback_window_sessions_max'] == 7
          assert params['drawdown_fraction_min'] == 0.20
          assert params['drawdown_fraction_max'] == 0.25
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - name: Upload W01 source-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-w01-bear-pullback-source-readiness
          path: output/v5_w01_bear_pullback_source_readiness/
          if-no-files-found: error
          retention-days: 14
