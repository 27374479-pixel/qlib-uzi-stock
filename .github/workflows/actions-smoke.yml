name: Actions smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-smoke.yml"

jobs:
  ubuntu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Echo Ubuntu runner health
        run: |
          echo "ubuntu runner ok"
          python --version

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Echo Windows runner health
        shell: pwsh
        run: |
          Write-Host "windows runner ok"
          python --version
