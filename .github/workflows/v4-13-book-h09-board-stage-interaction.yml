name: V4.13 book H09 board-stage interaction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-13-book-h09-board-stage-interaction.yml"
      - "v4_13_book_h09_board_stage_interaction.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-13-book-h09-board-stage-interaction
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<3" pandas pyarrow duckdb baostock requests

      - name: Materialize frozen CSI800 membership
        run: |
          mkdir -p qlib_data/cn_data/instruments
          cp data_lake/universe/csi800_membership_monthly.tsv qlib_data/cn_data/instruments/csi800.txt
          test -s qlib_data/cn_data/instruments/csi800.txt

      - name: Verify V4.12 prerequisite
        run: test -s output/v4_12_book_lenghuchong_reseal_trades.csv

      - name: Run V4.13 H09 interaction audit
        run: python v4_13_book_h09_board_stage_interaction.py

      - name: Persist V4.13 results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -f output/v4_13_book_h09_board_stage_interaction.json || git add -f output/v4_13_book_h09_board_stage_interaction.json
          test ! -f output/v4_13_book_h09_board_stage_interaction.csv || git add -f output/v4_13_book_h09_board_stage_interaction.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: persist V4.13 H09 board-stage interaction results [skip ci]"
            git push
          fi
